name: Destruir Infraestructura

run-name: ${{github.actor}} esta destruyendo la infraestructura en AWS
on:
    workflow_dispatch:
        inputs:
            confirmar:
                description: 'Escribir destroy para confirmar'
                required: true

permissions:
    contents: read
    id-token: write

jobs:
    Terraform-Destroy:
        if: github.event.inputs.confirmar == 'destroy' && github.ref == 'refs/heads/development'
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v4

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{vars.AWS_ROLE_ARN}}
                  aws-region: ${{vars.AWS_REGION}}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.10.5

            - run: terraform -chdir=terraform init -backend-config="bucket=${{vars.TF_STATE_BUCKET}}" -backend-config="region=${{vars.AWS_REGION}}"
            - run: terraform -chdir=terraform destroy -input=false -auto-approve -var="aws_region=${{vars.AWS_REGION}}"
