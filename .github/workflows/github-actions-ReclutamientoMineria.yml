name: Github Actions sobre Plataforma Mineria

run-name: ${{github.actor}} esta ejecutando el pipeline de la Plataforma Mineria

on:
  push:
    branches:
      - main
      - development
      - 'releases/**'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read
  id-token: write

jobs:
  Validar-Codigo-Backend-y-Frontend:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Evento ${{github.event_name}} en la rama ${{github.ref}}"

  Validar-Infraestructura:
    runs-on: ubuntu-latest
    needs: Validar-Codigo-Backend-y-Frontend
    steps:
      - run: echo "Validacion completada"

  Publicar-en-AWS:
    runs-on: ubuntu-latest
    needs: Validar-Infraestructura
    environment: dev
    if: github.ref == 'refs/heads/development'
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configurar ejecutor de Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform con Backend S3
        run: |
          cd terraform
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=lab09/dev/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Aplicar Infraestructura en AWS
        run: |
          cd terraform
          terraform apply -auto-approve

  Comprobar-Publicacion:
    runs-on: ubuntu-latest
    needs: Publicar-en-AWS
    steps:
      - run: echo "Comprobacion de despliegue exitosa"