name: Github Actions sobre Plataforma Mineria

run-name: ${{github.actor}} esta ejecutando el pipeline de la Plataforma Mineria
on:
    push:
        branches:
            - main
            - development
            - 'releases/**'
    pull_request:
        branches:
            - development
            - main

permissions:
    contents: read

jobs:
    Probar-Backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven
            - run: mvn -B -f backend/pom.xml org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent verify org.jacoco:jacoco-maven-plugin:0.8.12:report
            - name: Cobertura minima de 70 %
              run: |
                  awk -F, 'NR>1 {f+=$8; c+=$9} END {p=(c*100)/(f+c); printf "Cobertura de lineas: %.2f %%\n", p; if (p < 70) exit 1}' backend/target/site/jacoco/jacoco.csv
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: cobertura-backend
                  path: backend/target/site/jacoco

    Construir-Frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - run: npm ci --prefix frontend
            - run: npm run build --prefix frontend
              env:
                  VITE_API_URL: ''
            - uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist

    Validar-Infraestructura:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Evento ${{github.event_name}} en la rama ${{github.ref}} del repositorio ${{github.repository}}"
            - uses: actions/checkout@v4
            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.10.5
            - run: terraform -chdir=iac/terraform fmt -check -recursive
            - run: terraform -chdir=iac/terraform init -backend=false
            - run: terraform -chdir=iac/terraform validate

    Publicar-en-AWS:
        runs-on: ubuntu-latest
        needs: Validar-Infraestructura
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        environment: dev
        permissions:
            contents: read
            id-token: write
        outputs:
            web_url: ${{steps.salida.outputs.web_url}}
        steps:
            - uses: actions/checkout@v4
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{vars.AWS_ROLE_ARN}}
                  aws-region: ${{vars.AWS_REGION}}
            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.10.5
                  terraform_wrapper: false
            - run: terraform -chdir=iac/terraform init -backend-config="bucket=${{vars.TF_STATE_BUCKET}}" -backend-config="region=${{vars.AWS_REGION}}"
            - run: terraform -chdir=iac/terraform plan -input=false -var="aws_region=${{vars.AWS_REGION}}" -out=tfplan
            - run: terraform -chdir=iac/terraform apply -input=false -auto-approve tfplan
            - id: salida
              run: echo "web_url=$(terraform -chdir=iac/terraform output -json | jq -r '.web_url.value // empty')" >> "$GITHUB_OUTPUT"

    Comprobar-Publicacion:
        runs-on: ubuntu-latest
        needs: Publicar-en-AWS
        if: needs.Publicar-en-AWS.outputs.web_url != ''
        steps:
            - run: echo "Se comprueba que la pagina responda en ${{needs.Publicar-en-AWS.outputs.web_url}}"
            - run: |
                  for i in $(seq 1 20); do
                      if curl -fsS --max-time 5 "${{needs.Publicar-en-AWS.outputs.web_url}}"; then exit 0; fi
                      echo "Intento $i: todavia no responde, esperando 15 segundos"
                      sleep 15
                  done
                  exit 1
