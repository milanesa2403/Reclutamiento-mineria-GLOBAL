name: Github Actions sobre Plataforma Mineria

run-name: ${{github.actor}} esta ejecutando el pipeline de la Plataforma Mineria
on:
    push:
        branches:
            - main
            - development
            - 'releases/**'
    pull_request:
        branches:
            - development
             - main

jobs:
    Validar-Codigo-Backend-y-Frontend:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Evento ${{github.event_name}} en la rama ${{github.ref}} del repositorio ${{github.repository}}"
            - run: echo "Se instalan Java 21 y Node 24, se revisa el estilo con npm run lint y se ejecutan las pruebas con mvn test"
            - run: echo "Se exige una cobertura minima del 70% con mvn verify y se generan los archivos con mvn package y npm run build"

    Validar-Infraestructura:
        runs-on: ubuntu-latest
        needs: Validar-Codigo-Backend-y-Frontend
        steps:
            - run: echo "Se revisa y valida Terraform con terraform fmt -check y terraform validate. El estado esta en un bucket S3"
            - run: echo "Se muestra que recursos se crearian en AWS con terraform plan, sin aplicar nada"
            - run: echo "Prueba de carga con k6 (300 usuarios por 10 minutos). Si hay mas de 5% de errores o mas de 3 segundos, no se publica"

    Publicar-en-AWS:
        runs-on: ubuntu-latest
        needs: Validar-Infraestructura
        environment: dev
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        steps:
            - uses: actions/checkout@v4
            - uses: aws-actions/configure-aws-credentials@v4
            with:
                role-to-assume: ${{vars.AWS_ROLE_ARN}}
                aws-region: ${{vars.AWS_REGION}}
            - uses: hashicorp/setup-terraform@v3
            with:
                terraform_version: 1.10.5
            - run: terraform -chdir=terraform init -backend-config="bucket=${{vars.TF_STATE_BUCKET}}" -backend-config="key=lab09/dev/terraform.tfstate" -backend-config="region=${{vars.AWS_REGION}}"
            - run: terraform -chdir=terraform apply -input=false -auto-approve
            
    Comprobar-Publicacion:
        runs-on: ubuntu-latest
        needs: Publicar-en-AWS
        steps:
            - run: echo "Se comprueba con curl la ruta /health y se revisan los errores 5xx en CloudWatch"
            - run: echo "Si los errores superan el 5%, se vuelve a la version anterior con terraform apply (maximo 15 minutos)"
            - run: echo "Se avisa al equipo por correo con Amazon SNS"
