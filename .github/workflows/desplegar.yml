name: Desplegar Infraestructura

run-name: ${{github.actor}} esta desplegando la infraestructura en AWS
on:
    push:
        branches:
            - development
        paths:
            - 'terraform/**'

permissions:
    contents: read
    id-token: write

jobs:
    Terraform-Apply:
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - uses: actions/checkout@v4

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{vars.AWS_ROLE_ARN}}
                  aws-region: ${{vars.AWS_REGION}}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.10.5

            - run: terraform -chdir=terraform init -backend-config="bucket=${{vars.TF_STATE_BUCKET}}" -backend-config="key=lab09/dev/terraform.tfstate" -backend-config="region=${{vars.AWS_REGION}}"
            - run: terraform -chdir=terraform validate
            - run: terraform -chdir=terraform plan -input=false -var="aws_region=${{vars.AWS_REGION}}" -out=tfplan
            - run: terraform -chdir=terraform apply -input=false -auto-approve tfplan
