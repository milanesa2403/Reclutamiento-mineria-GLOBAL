- name: Desplegar backend en las instancias EC2
  hosts: web
  serial: 1
  gather_facts: false
  become: true
  vars:
    ansible_connection: community.aws.aws_ssm
    ansible_aws_ssm_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-2', true) }}"
    ansible_aws_ssm_bucket_name: "{{ lookup('env', 'ANSIBLE_BUCKET') }}"
  tasks:
    - name: Ejecutar el script de despliegue con la imagen publicada
      ansible.builtin.command: /opt/plataforma/desplegar.sh
      changed_when: true

    - name: Esperar a que el backend responda
      ansible.builtin.uri:
        url: https://localhost/api/health
        validate_certs: false
        status_code: 200
      register: salud
      retries: 30
      delay: 10
      until: salud.status == 200
