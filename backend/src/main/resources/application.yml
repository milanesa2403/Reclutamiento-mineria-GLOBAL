spring:
  application:
    name: mineria-reclutamiento-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMO:5}
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080
  forward-headers-strategy: framework

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  aws:
    region: ${AWS_REGION:us-east-2}
    bucket: ${APP_S3_BUCKET:}
    cola-cv: ${APP_SQS_CV_URL:}
    prefijo: cvs
    url-firmada-segundos: 300
  cognito:
    issuer-uri: ${COGNITO_ISSUER_URI:}
    client-id: ${COGNITO_CLIENT_ID:}
  empresas:
    dias-limite-documento: 15
