spring.datasource.url=jdbc:h2:mem:mineria
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
jwt.secreto=${JWT_SECRETO:cambia-esta-clave-de-desarrollo-minimo-32-bytes!!}
admin.clave=${ADMIN_CLAVE:AdminMineria123!}
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# --- Archivos (RNF 16): max 10 MB ---
app.almacen.ruta=${ALMACEN_RUTA:./almacen}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Seguridad (RNF 8 y 11) ---
jwt.minutos=30
seguridad.ip.max-fallos=10
seguridad.ip.ventana-minutos=10
seguridad.ip.bloqueo-minutos=15

# --- Privacidad (RNF 12): periodo de gracia antes de borrar (maximo legal 30 dias) ---
privacidad.dias-gracia-borrado=7

# --- Cola de postulaciones (imita SQS) ---
app.cola.intervalo-ms=5000

# --- OpenAPI (RNF 29) ---
springdoc.swagger-ui.path=/swagger-ui.html
